name: Consulta diária

# Uma requisição leve por dia ao projeto Supabase, para o plano gratuito não pausar por inatividade.
# Só leitura, sem dado pessoal. URL e chave vêm dos segredos do repositório (o repositório é público).
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: consulta-diaria
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: GET leve no Supabase
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Segredos SUPABASE_URL e/ou SUPABASE_PUBLISHABLE_KEY ausentes; consulta não feita."
            exit 0
          fi
          base="${SUPABASE_URL%/}"
          for tentativa in 1 2 3; do
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 20 --request GET \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$base/rest/v1/" || true)
            echo "Tentativa $tentativa: HTTP ${codigo:-sem resposta}"
            case "$codigo" in
              [234]??) exit 0 ;;
            esac
            [ "$tentativa" -lt 3 ] && sleep $((tentativa * 15))
          done
          echo "::error::Supabase não respondeu (5xx ou timeout) em 3 tentativas."
          exit 1
