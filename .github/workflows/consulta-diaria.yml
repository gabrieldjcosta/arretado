name: Consulta diária

# Uma requisição leve por dia ao projeto Supabase, para o plano gratuito não pausar por inatividade.
# Lê 1 id de `arretado.catalogo` (leitura anônima, sem dado pessoal) e só passa com HTTP 200: o banco respondeu.
# Segredo ausente ou qualquer outro código (4xx incluso) reprova o job. A raiz `/rest/v1/` não serve: recusa
# chave publicável com 401 e não toca o banco. URL e chave vêm dos segredos do repositório (o repositório é público).
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: consulta-diaria
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: GET leve no Supabase
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Segredos SUPABASE_URL e/ou SUPABASE_PUBLISHABLE_KEY ausentes; consulta não feita."
            exit 1
          fi
          base="${SUPABASE_URL%/}"
          for tentativa in 1 2 3; do
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 20 --request GET \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header "Accept-Profile: arretado" \
              "$base/rest/v1/catalogo?select=id&limit=1" || true)
            echo "Tentativa $tentativa: HTTP ${codigo:-sem resposta}"
            [ "$codigo" = 200 ] && exit 0
            [ "$tentativa" -lt 3 ] && sleep $((tentativa * 15))
          done
          echo "::error::Consulta ao Supabase falhou em 3 tentativas (esperado HTTP 200; último: ${codigo:-sem resposta})."
          exit 1
