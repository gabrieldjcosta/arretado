version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: integracao
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # typescript-eslint limita o peer do TypeScript (< 6.1) e o Node do projeto é o 22: os dois
    # saltos de versão maior quebraram o `npm ci` na integracao em 22/10/2026.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # O Chromium do contêiner de sessão é o chromium-1194, do Playwright 1.56.1 (docs/solucao-de-problemas.md).
      - dependency-name: '@playwright/test'
      - dependency-name: playwright-core
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: integracao
